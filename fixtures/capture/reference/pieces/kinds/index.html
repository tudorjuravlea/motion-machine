<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>capture reference: cut kinds</title>
</head>
<body>
  <script type="module">
    import { mount } from '../../../../../runtime/kit/kit.js';
