<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>kit-smoke-cues</title>
</head>
<body>
  <script type="module">
    import { mount } from '../../../runtime/kit/kit.js';
    const load = (f) => fetch(new URL(f, import.meta.url)).then((r) => r.json());
    const [story, style] = await Promise.all([load('story.json'), load('style.json')]);
    await mount({ story, style, patternsBase: new URL('../../kit-smoke/patterns/', import.meta.url) });
  </script>
</body>
</html>
