<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>vendored three</title><style>html,body{margin:0;background:#101014}</style></head>
<body>
  <!-- The vendored Three.js renders a lit rounded box (tests/kit/three.browser.test.mjs). -->
  <script type="module">
    import * as THREE from '../../../runtime/vendor/three/0.170.0/three.module.min.js';
    import { RoundedBoxGeometry } from '../../../runtime/vendor/three/0.170.0/RoundedBoxGeometry.js';
    import { RoomEnvironment } from '../../../runtime/vendor/three/0.170.0/RoomEnvironment.js';
    const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(480, 480); document.body.append(r.domElement);
    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
    const mesh = new THREE.Mesh(new RoundedBoxGeometry(1.2, 2.4, 0.2, 6, 0.12), new THREE.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.7, roughness: 0.3 }));
    scene.add(mesh);
    const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0, 7);
    window.draw = (a) => { mesh.rotation.y = a; mesh.rotation.x = 0.2; r.render(scene, cam); };
    window.ready = true;
  </script>
</body></html>
