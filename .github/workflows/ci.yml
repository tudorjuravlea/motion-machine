# Motion Machine CI: the suite runs as three groups side by side (unit tests, browser tests, golden
# pieces), the browser and golden groups sharded, then the release sweep. A contributor waits for the
# slowest shard, not for the sum.
#
# The font-glyph and pixel checks (G-LOCAL glyph, G-BRAND pixels, G-LEGIBLE sizes) depend on the
# fonts bundled under styles/fonts/, never on system fonts: a runner with different system fonts must
# produce the same verdicts. If a check passes locally and fails here (or the reverse), look for a
# font or Chromium-version difference first, not a runner quirk.
#
# release-check runs without docs/private/brand-words.txt (git-ignored, the author's private word
# list); its report says "private list absent" and only the shipped generic patterns are swept. The
# full sweep is a local pre-publication step (docs/RELEASING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ffmpeg
        uses: ./.github/actions/ffmpeg

      - name: Every test file belongs to exactly one group
        run: npm run test:groups

      - name: Unit tests
        run: npm run test:unit

  browser:
    name: browser tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MM_TEST_SHARD: ${{ matrix.shard }}/3
      # Three browser test files share the runner's four CPUs with software WebGL (the 3D devices);
      # a page that decodes large captured screens at mount took longer than the 30 s ready wait.
      # The scale stretches only how long a page may take (the ready, slow-frame and studio waits),
      # never what it must draw.
      MM_TIMEOUT_SCALE: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Chromium system libraries
        uses: ./.github/actions/chromium-deps

      - name: ffmpeg
        uses: ./.github/actions/ffmpeg

      - name: Doctor
        run: node scripts/mm.mjs doctor

      # The network captures (brand capture, capture site from a URL) open Chromium with its sandbox
      # on. Ubuntu 24.04 (the runner image is pinned to it) blocks the unprivileged user namespaces that sandbox needs, so it would not
      # start ("No usable sandbox!"); allow them here rather than run the captures unsandboxed.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Browser tests
        run: npm run test:browser

  golden:
    name: golden pieces (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MM_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Chromium system libraries
        uses: ./.github/actions/chromium-deps

      - name: ffmpeg
        uses: ./.github/actions/ffmpeg

      - name: Golden tests
        run: npm run test:golden

  release:
    name: gate and release check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Chromium system libraries
        uses: ./.github/actions/chromium-deps

      - name: ffmpeg
        uses: ./.github/actions/ffmpeg

      # release-check's R-GOLDEN sweep wants out/check.json beside every golden piece; out/ is not
      # tracked, so the gate runs on each here.
      - name: Gate the golden pieces
        run: |
          for dir in pieces/golden-*; do
            echo "::group::mm check $dir"
            node scripts/mm.mjs check "$dir"
            echo "::endgroup::"
          done

      - name: Release check
        run: node scripts/mm.mjs release-check
