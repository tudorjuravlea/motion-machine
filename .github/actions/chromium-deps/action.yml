name: chromium-deps
description: >-
  Chromium's system libraries, installing only the packages the runner image lacks (often none), with
  apt's own retries and a wait on the package lock, and each apt call under its own time limit so a
  stopped attempt never leaves the lock held.
runs:
  using: composite
  steps:
    - name: Install Chromium system libraries
      shell: bash
      run: |
        set -uo pipefail
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "600";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-mm-apt > /dev/null
        plan="$(npx playwright install-deps --dry-run chromium 2>/dev/null || true)"
        pkgs="$(printf '%s\n' "$plan" | grep -o 'apt-get install[^"&;]*' | sed -e 's/apt-get install//' -e 's/ -y//g' -e 's/--no-install-recommends//g' | tr ' ' '\n' | grep -v '^$' | sort -u || true)"
        if [ -z "$pkgs" ]; then
          echo "No package list from Playwright; installing its full set"
          timeout --kill-after=30 900 npx playwright install-deps chromium
          exit $?
        fi
        missing=""
        for p in $pkgs; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || missing="$missing $p"
        done
        if [ -z "$missing" ]; then
          echo "Chromium system libraries: all $(printf '%s\n' $pkgs | wc -l) packages already present"
          exit 0
        fi
        echo "Chromium system libraries missing:$missing"
        for attempt in 1 2; do
          if timeout --kill-after=30 900 sudo apt-get update -o Acquire::Languages=none \
            && timeout --kill-after=30 900 sudo apt-get install -y --no-install-recommends $missing; then
            exit 0
          fi
          echo "::warning::Chromium system libraries: attempt $attempt failed"
          sleep 15
        done
        exit 1
