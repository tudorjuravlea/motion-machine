name: Bug report
description: Something does not work as the documents say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, please do not use this form: follow
        the steps in SECURITY.md at the root of the repository.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: The command you ran, what it printed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest piece or the shortest sequence of commands that shows it. A story.json and style.json are ideal.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node scripts/mm.mjs doctor` and `node scripts/mm.mjs --version`
      render: text
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Contents of out/check.json, if the gate was involved
      description: Paste the failing or surprising rules only, or attach the file.
      render: json
  - type: input
    id: platform
    attributes:
      label: Operating system and Node version
      placeholder: macOS 15, Node 22.12
