<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep work</title>
<style>
  @font-face { font-family: Manrope; src: url(../../../../styles/fonts/manrope/manrope-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Manrope; src: url(../../../../styles/fonts/manrope/manrope-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  :root { --bg: #2F6F5E; --ink: #FFFFFF; --soft: rgba(255,255,255,.7); --sun: #E9A23B; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Manrope, system-ui, sans-serif; background: var(--bg); color: var(--ink); padding: 64px 24px 0; height: 844px; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .bar i { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); }
  .bar small { font-size: 14px; color: var(--soft); }
  h1 { font-size: 30px; letter-spacing: -0.02em; margin-top: 28px; }
  .sub { color: var(--soft); font-size: 14px; margin-top: 4px; }
  .ring { position: relative; width: 260px; height: 260px; margin: 34px auto 0; }
  .ring svg { width: 260px; height: 260px; }
  .ring .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .t b { font-size: 52px; letter-spacing: -0.03em; }
  .ring .t small { color: var(--soft); font-size: 13px; }
  .chips { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
  .chips span { border: 1.5px solid rgba(255,255,255,.4); border-radius: 18px; padding: 8px 14px; font-size: 13px; }
  .go { display: flex; gap: 12px; margin-top: 40px; }
  .go span { flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .go .pause { background: rgba(255,255,255,.14); }
  .go .done { background: var(--sun); color: #1F2328; }
</style>
</head>
<body>
  <div class="bar"><i></i><small>Session 2 of 3</small><i></i></div>
  <h1>Deep work</h1>
  <div class="sub">Write the brief · notifications off</div>
  <div class="ring">
    <svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="116" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="14"/><circle cx="130" cy="130" r="116" fill="none" stroke="#E9A23B" stroke-width="14" stroke-linecap="round" stroke-dasharray="729" stroke-dashoffset="230" transform="rotate(-90 130 130)"/></svg>
    <div class="t"><b>24:18</b><small>of 50 minutes</small></div>
  </div>
  <div class="chips"><span>Quiet</span><span>Rain sounds</span><span>+10 min</span></div>
  <div class="go"><span class="pause">Pause</span><span class="done">Done</span></div>
</body>
</html>
