<div class="social-card">
  <div class="social-card__card">
    <div class="social-card__head">
      <span class="social-card__avatar"><span data-slot="avatar"></span></span>
      <span class="social-card__who">
        <span class="social-card__handle" data-slot="handle"></span>
        <span class="social-card__sub" data-slot="sub"></span>
      </span>
      <span class="social-card__action" data-slot="action"></span>
    </div>
    <p class="social-card__body" data-slot="body"></p>
    <div class="social-card__stats">
      <span class="social-card__stat"><i class="social-card__icon" data-keep data-icon="1"></i><span data-slot="stat-1"></span></span>
      <span class="social-card__stat"><i class="social-card__icon" data-keep data-icon="2"></i><span data-slot="stat-2"></span></span>
      <span class="social-card__stat"><i class="social-card__icon" data-keep data-icon="3"></i><span data-slot="stat-3"></span></span>
    </div>
  </div>
</div>
