<div class="object-card">
  <div class="object-card__object" data-focus="object" data-slot="object">
    <i class="object-card__string" aria-hidden="true"></i>
    <i class="object-card__hole" aria-hidden="true"></i>
    <i class="object-card__rings" aria-hidden="true"><b></b><b></b></i>
    <div class="object-card__mark" data-slot="mark"></div>
    <div class="object-card__rows">
      <div class="object-card__row" data-slot="row-1"></div>
      <div class="object-card__row" data-slot="row-2"></div>
      <div class="object-card__row" data-slot="row-3"></div>
    </div>
    <div class="object-card__total">
      <div class="object-card__label" data-slot="label"></div>
      <div class="object-card__figure" data-slot="figure"></div>
    </div>
    <div class="object-card__note" data-slot="note"></div>
  </div>
</div>
