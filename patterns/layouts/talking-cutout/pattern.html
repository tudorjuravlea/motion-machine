<div class="talking-cutout">
  <p class="talking-cutout__backdrop" data-slot="backdrop" data-decor data-over></p>
  <img class="talking-cutout__speaker" data-footage data-footage-matte data-media data-keep alt="">
  <div class="talking-cutout__front">
    <h2 class="talking-cutout__headline mm-fit" data-slot="headline" data-face-safe></h2>
    <p class="talking-cutout__caption" data-slot="caption" data-face-safe></p>
  </div>
  <div class="talking-cutout__panel"><div class="talking-cutout__tile" data-slot="panel" data-face-safe></div></div>
</div>
